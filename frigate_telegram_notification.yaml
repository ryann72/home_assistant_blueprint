blueprint:
  name: "Frigate - Telegram Bot (Snapshot + Clip)"
  description: "Notification Frigate via snapshot et clip"
  domain: automation

  input:
    camera:
      name: Caméra Frigate
      selector:
        text:

    config_entry_id:
      name: Telegram config_entry_id
      selector:
        text:

    base_url:
      name: URL externe Home Assistant
      selector:
        text:

    notification_text:
      name: Texte personnalisé (optionnel)
      default: ""
      selector:
        text:

    zones:
      name: Zones Frigate (optionnel)
      default: []
      selector:
        select:
          multiple: true
          options: []

    labels:
      name: Objets Frigate (optionnel)
      default: []
      selector:
        select:
          multiple: true
          options:
            - person
            - car
            - dog
            - cat

mode: single
max_exceeded: silent

trigger:
  - platform: mqtt
    topic: frigate/events

variables:
  # ---- Inputs copiés ----
  input_camera: !input camera
  input_labels: !input labels
  input_zones: !input zones
  input_base_url: !input base_url
  input_notif_text: !input notification_text

  # ---- Données Frigate ----
  event_type: "{{ trigger.payload_json.type }}"
  event_id: "{{ trigger.payload_json.after.id }}"
  cam: "{{ trigger.payload_json.after.camera }}"
  label: "{{ trigger.payload_json.after.label | lower }}"
  entered_zones: "{{ trigger.payload_json.after.entered_zones }}"

  # ---- URLs Frigate ----
  snapshot_url: >
    {{ input_base_url }}/api/frigate/notifications/{{ event_id }}/snapshot.jpg

  clip_url: >
    {{ input_base_url }}/api/frigate/notifications/{{ event_id }}/{{ cam }}/clip.mp4

  # ---- Texte notification ----
  notif_text: >
    {{ input_notif_text
       if input_notif_text | length > 0
       else '🚨 ' ~ cam | replace('_',' ') | title
       ~ ' : ' ~ label | title
       ~ ' détecté à ' ~ states('sensor.time') }}

condition:
  - "{{ event_type == 'new' }}"
  - "{{ cam == input_camera }}"
  - "{{ input_labels | length == 0 or label in input_labels }}"
  - "{{ input_zones | length == 0 or entered_zones | select('in', input_zones) | list | length > 0 }}"

action:
  # 📸 SNAPSHOT
  - service: telegram_bot.send_photo
    data:
      config_entry_id: !input config_entry_id
      url: "{{ snapshot_url }}"
      caption: "{{ notif_text }}"
      disable_notification: true

  # ⏳ FIN EVENT
  - wait_for_trigger:
      - platform: mqtt
        topic: frigate/events
        value_template: "{{ value_json.after.id }}"
        payload: "{{ event_id }}"
    timeout: "00:02:00"
    continue_on_timeout: false

  - condition: template
    value_template: "{{ wait.trigger.payload_json.type == 'end' }}"

  # 🎬 CLIP
  - service: telegram_bot.send_video
    data:
      config_entry_id: !input config_entry_id
      url: "{{ clip_url }}"
      caption: "{{ notif_text }}"
      disable_notification: true
